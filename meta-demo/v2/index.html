let L="ka";try{L=localStorage.getItem("mt_lang")||"ka"}catch(e){}
function waLink(t){return "https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
function render(){const t=T[L];document.documentElement.lang=L;
document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
document.querySelectorAll("[data-wa]").forEach(a=>a.href=waLink(t.waHello+"."));
document.getElementById("h1").innerHTML=t.h1a+"<em>"+t.h1b+"</em>"+t.h1c;
document.getElementById("bTitle").innerHTML=t.bT1+"<em>"+t.bT2+"</em>";
document.getElementById("strip").innerHTML=t.strip.map(x=>`<span>${svg("star",1)}${x}</span>`).join("");
document.getElementById("steps").innerHTML=t.steps.map((s,i)=>`<div class="step"><b>0${i+1}</b><span>${s[0]}</span><small>${s[1]}</small></div>`).join("");
document.getElementById("ben").innerHTML=t.ben.map(x=>`<li>${svg("check")}${x}</li>`).join("");
document.getElementById("sgrid").innerHTML=SVC.map(s=>`<article class="sv"><div class="ic">${svg(s[0])}</div><h3>${t[s[1]]}</h3><p>${t[s[1]+"p"]}</p><div class="tags">${t[s[1]+"l"].map(x=>`<span>${x}</span>`).join("")}</div>${t[s[1]+"d"]?`<span class="dr">${t[s[1]+"d"]}</span>`:""}</article>`).join("");
document.getElementById("types").innerHTML=t.types.map(x=>`<div class="type"><i style="background:${x[0]}"></i><b>${x[1]}</b><span>${x[2]}</span></div>`).join("");
document.getElementById("cgrid").innerHTML=t.cases.map((c,i)=>`<article class="case c${i+1}"><div${c[5]?` class="ba" data-b="${t.bef}" data-a="${t.aft}"`:""}><img src="../img/${c[4]}" alt="${c[1]}" loading="lazy"></div><div class="b"><span class="t">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p><span class="dr">${c[3]}</span></div></article>`).join("");
document.getElementById("wl").innerHTML=t.wl.map(x=>`<li>${x}</li>`).join("");
document.getElementById("quotes").innerHTML=t.quotes.map(q=>`<div class="q">${q[0]}<span>${q[1]}</span></div>`).join("");
document.getElementById("tgrid").innerHTML=t.team.map(d=>`<div class="doc${d[2]?" f":""}"><div class="av">${d[0].split(" ").map(w=>w[0]).join("")}</div><b>${d[0]}</b><span>${d[1]}</span></div>`).join("");
document.getElementById("ogrid").innerHTML=t.of.map(o=>`<div class="oc${o[3]?" hl":""}"><span class="when">${o[0]}</span><h3>${o[1]}</h3><ul>${o[2].map(r=>`<li><span>${r[0]}</span><b>${r[1]}</b></li>`).join("")}</ul></div>`).join("");
document.getElementById("revs").innerHTML=REV.map(r=>`<div class="rev"><span class="st">★★★★★</span><p>${r[1]}</p><footer><span>${r[0]}</span><span>Google</span></footer></div>`).join("");
document.getElementById("hours").innerHTML=t.days.map((d,i)=>`<span>${d}</span><span>${HRS[i][0]}–${HRS[i][1]}</span>`).join("");
const s=document.getElementById("fSvc");s.innerHTML=`<option value="">${t.fSvcDef}</option>`+SVC.map(o=>`<option>${t[o[1]]}</option>`).join("");}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("mt_lang",L)}catch(e){}render()});
document.getElementById("bform").onsubmit=e=>{e.preventDefault();const t=T[L];const v=id=>document.getElementById(id).value.trim();
