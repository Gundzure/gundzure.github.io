/* Auto-service variant of the clinic template: graphite ground, steel-blue accent, same sections. */

  canal:'<path d="M8 3.5c-2.5 0-4.5 2-4.5 4.6 0 2.6 1.1 4 1.8 6.2.7 2.4.9 6.2 2.8 6.2 1.7 0 1.6-4.8 3.9-4.8s2.2 4.8 3.9 4.8c1.9 0 2.1-3.8 2.8-6.2.7-2.2 1.8-3.6 1.8-6.2 0-2.6-2-4.6-4.5-4.6-1.6 0-2.4.9-4 .9s-2.4-.9-4-.9z"/><path d="M10 9v8M14 9v8"/>',

  scan:'<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M4 12h16"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9S14.5 18.3 12 21c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 14.5l2 2 4-4"/>',
  plane:'<path d="M21 15.5l-8-4V5a1.5 1.5 0 00-3 0v6.5l-8 4V18l8-2.5V19l-2.5 2h7L12 19v-3.5l8 2.5z" transform="translate(.5 -1)"/>',
  card:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  phone:'<path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 005.5 5.5L15 13l4 1.5V18a2 2 0 01-2 2A14 14 0 013 6a2 2 0 012-2z"/>',
  wa:'<path d="M4 20l1.2-4A8 8 0 1112 20a8 8 0 01-4-1.1z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a4.5 4.5 0 01-2.3-2.3l.8-1-1-2z" stroke-width="1.3"/>',
  fb:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M13.5 20.5v-7h2.3l.4-2.7h-2.7V9.2c0-.8.3-1.3 1.4-1.3h1.4V5.5a18 18 0 00-2-.1c-2.1 0-3.4 1.2-3.4 3.5v1.9H8.5v2.7h2.4v7"/>',
  insta:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".8"/>',
  book:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.wrench}</svg>`;

const telHref = 'tel:' + C.phone;
const waBase = 'https://wa.me/' + C.whatsapp.number;

// Tbilisi clock
function tbilisiNow(){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tbilisi',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  const day = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(g('weekday'));
  return { day, min: (+g('hour')%24)*60 + +g('minute') };
}
const toMin = s => { const [a,b] = s.split(':'); return +a*60 + +b; };
function openState(){
  const n = tbilisiNow(), hr = C.hours;
  const today = hr[n.day];
  if (today && n.min >= toMin(today[0]) && n.min < toMin(today[1])) return { open:true, text: T('until',{t:today[1]}) };
  for (let i=0;i<8;i++){
    const d = (n.day+i)%7, x = hr[d];
    if (!x) continue;
    if (i===0 && n.min >= toMin(x[0])) continue;
    const dn = i===0 ? T('today') : i===1 ? T('tomorrow') : I[lang].days[d];
    return { open:false, text: T('opens',{d:dn,t:x[0]}) };
  }
  return { open:false, text:'' };
}

function render(){
  const D = I[lang];
  document.documentElement.lang = D.htmlLang;
  document.body.classList.toggle('notes', notes);
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));

  $('demoText').textContent = T('demoText',{name:L(C.name)});
  $('notesBtn').textContent = notes ? T('notesHide') : T('notesShow');
  $('notesLegend').textContent = T('notesLegend');

  $('logo').innerHTML = `<b>${esc(C.brand.word)}</b><span>${esc(C.brand.sub)}</span>`;
  $('logo').setAttribute('aria-label', L(C.name));
  $('nav').innerHTML = ['services','prices','team','reviews','contact'].filter(k=>k!=='team'||(C.team&&C.team.length)).map(k=>`<a href="#${k}">${esc(D.nav[k])}</a>`).join('');
  $('langs').innerHTML = LANGS.map(l=>`<button type="button" data-l="${l}" aria-pressed="${l===lang}" lang="${l}">${esc(I[l].langName)}</button>`).join('');

  const hi = C.hero.image;
  $('hero').classList.toggle('has-photo', !!hi);
  if (hi){ $('heroImg').src = hi; $('heroImg').alt = L(C.hero.imageAlt) || L(C.name); $('heroImg').hidden = false; }
  $('heroTitle').textContent = L(C.hero.title);
  $('heroLead').textContent = L(C.hero.lead);
  const waLink = `<a class="btn btn-wa${G(C.whatsapp)}" href="${waBase}?text=${encodeURIComponent(T('waHello'))}" target="_blank" rel="noopener">${ico('wa')}${esc(T('whatsapp'))}</a>`;
  $('heroCtas').innerHTML = `<a class="btn btn-primary" href="#book">${ico('book')}${esc(T('book'))}</a>${waLink}<a class="btn btn-ghost" href="${telHref}">${ico('phone')}${esc(C.phoneDisplay)}</a>`;
  $('rating').href = C.mapsUrl;
  $('rating').innerHTML = `<strong>${C.rating.toFixed(1)}</strong><span class="stars" aria-hidden="true">★★★★★</span><span>${esc(T('reviewsOnGoogle',{n:C.reviewCount}))}</span>`;

  const st = openState(), nd = tbilisiNow();
  // group consecutive days with the same hours: "Mon–Fri 10:00–20:00"
  const groups = [];
  C.hours.forEach((x,i)=>{ const k = x ? x.join('–') : ''; const g = groups[groups.length-1];
    if (g && g.k === k) { g.to = i; } else groups.push({k, from:i, to:i}); });
  $('nowCard').innerHTML = `<p class="eyebrow" style="margin-bottom:14px">${esc(T('hoursTitle'))}</p>
    <div class="status"><span class="dot${st.open?' open':''}"></span>${esc(st.open?T('openNow'):T('closedNow'))} <small>${esc(st.text)}</small></div>
    <dl class="hgroups">${groups.map(g=>{
      const today = nd.day>=g.from && nd.day<=g.to;
      const days = g.from===g.to ? D.days[g.from] : `${D.daysShort[g.from]} – ${D.daysShort[g.to]}`;
      return `<div class="${today?'is-today':''}"><dt>${esc(days)}</dt><dd>${g.k?esc(g.k.replace('–',' – ')):esc(D.closed)}</dd></div>`;}).join('')}</dl>
    <p class="addr">${ico('pin')}<span>${esc(L(C.address))}</span></p>
    <div class="row"><a class="btn btn-ghost btn-sm" href="${telHref}">${ico('phone')}${esc(T('call'))}</a><a class="btn btn-ghost btn-sm" href="${C.directionsUrl}" target="_blank" rel="noopener">${ico('pin')}${esc(T('directions'))}</a></div>`;

  $('highs').innerHTML = C.highlights.map(x=>`<div class="high${G(x)}">${ico(x.icon)}<div><b>${esc(L(x.title))}</b><span>${esc(L(x.text))}</span></div></div>`).join('');

  $('svc').innerHTML = C.services.map(s=> s.image
    ? `<article class="has-img ${G(s).trim()}"><img class="svc-img" src="${esc(s.image)}" alt="${esc(L(s.title))}" loading="lazy"><div class="svc-body">${ico(s.icon)}<h3>${esc(L(s.title))}</h3><p>${esc(L(s.text))}</p></div></article>`
    : `<article class="${G(s).trim()}">${ico(s.icon)}<h3>${esc(L(s.title))}</h3><p>${esc(L(s.text))}</p></article>`).join('');

  $('ptableWrap').innerHTML = `<div class="${G(C.pricesNote).trim()}"><table class="ptable"><tbody>${C.prices.map(p=>`<tr><td>${esc(L(p.name))}</td><td>${p.price==null?`<span class="tbd">— ₾</span>`:esc(T('priceFrom',{p:p.price}))}</td></tr>`).join('')}</tbody></table>${C.prices.some(p=>p.price==null)?`<p style="margin-top:12px;font-size:14px;color:var(--muted)">${esc(T('pricesNoteText'))}</p>`:''}</div>`;

  $('team').hidden = !(C.team && C.team.length);
  $('teamGrid').className = 'team';
  if (C.teamNote && C.teamNote.guess){ $('teamGrid').classList.add('guess'); $('teamGrid').dataset.tag = T('guessTag'); $('teamGrid').title = C.teamNote.note||''; }
  $('teamGrid').innerHTML = C.team.map(d=>{
    const nm = L(d.name), ini = (d.name.en||nm).split(' ').map(w=>w[0]).slice(0,2).join('');
    const yrs = d.years ? (lang==='ru' ? 'Опыт: '+ruYears(d.years) : T('years',{n:d.years})) : '';
    const pic = d.photo ? `<img class="ava" src="${esc(d.photo)}" alt="${esc(nm)}">` : `<span class="ava ini" aria-hidden="true">${esc(ini)}</span>`;
    return `<div class="doc">${pic}<div><b>${esc(nm)}</b><span>${esc(L(d.role))}</span>${yrs?`<span>${esc(yrs)}</span>`:''}</div></div>`;}).join('');

  $('revSummary').innerHTML = `<span class="stars">★★★★★</span> <b>${C.rating.toFixed(1)}</b> · ${esc(T('reviewsOnGoogle',{n:C.reviewCount}))}`;
  $('revs').innerHTML = C.reviews.map(r=>`<figure class="rev" lang="${esc(r.lang)}"><span class="stars" aria-label="${r.stars}/5">${'★'.repeat(r.stars)}</span><blockquote>${esc(r.text)}</blockquote><footer><b>${esc(r.author)}</b><span>${esc(T('reviewFrom'))}</span></footer></figure>`).join('');
  $('revMore').href = C.mapsUrl; $('revMore').textContent = T('allReviews') + ' →';

  $('abroad').hidden = !(C.intl && C.intl.length);
  $('why').classList.toggle('has-img', !!C.intlImage);
  if (C.intlImage){ $('whyImg').src = C.intlImage; $('whyImg').alt = L(C.text && C.text.intlTitle) || ''; $('whyImg').hidden = false; }
  $('intl').innerHTML = (C.intl||[]).map(x=>`<article class="${G(x).trim()}">${ico(x.icon)}<div><h3>${esc(L(x.title))}</h3><p>${esc(L(x.text))}</p></div></article>`).join('');

  $('gal').className = 'gal';
  if (C.galleryNote && C.galleryNote.guess){ $('gal').classList.add('guess'); $('gal').dataset.tag = T('guessTag'); $('gal').title = C.galleryNote.note||''; }
  $('gal').innerHTML = C.gallery.map(g=> g.src ? `<div class="ph-wrap"><img class="ph" src="${esc(g.src)}" alt="${esc(L(g.label))}" loading="lazy"></div>` : `<div class="ph"><b>${esc(L(g.label))}</b><span>${esc(T('photoSoon'))}</span></div>`).join('');

  $('addrLine').innerHTML = `${esc(L(C.address))}`;
  $('phoneText').textContent = C.phoneDisplay; $('phoneText2').textContent = C.phoneDisplay;
  $('copyPhone').textContent = T('copy');
  $('map').innerHTML = BUILD.embedMap
    ? `<iframe title="${esc(T('mapAlt',{a:L(C.address)}))}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${C.geo.lat},${C.geo.lng}&z=17&hl=${lang}&output=embed"></iframe>`
    : `<a class="map-static" href="${C.mapsUrl}" target="_blank" rel="noopener" aria-label="${esc(T('openMaps'))}"><span>${ico('pin')}${esc(L(C.name))}</span></a>`;
  $('mapLinks').innerHTML = `<a class="btn btn-ghost btn-sm" href="${C.mapsUrl}" target="_blank" rel="noopener">${ico('pin')}${esc(T('openMaps'))}</a><a class="btn btn-ghost btn-sm" href="${C.directionsUrl}" target="_blank" rel="noopener">${esc(T('directions'))} →</a>`;
  $('hoursTable').innerHTML = C.hours.map((x,i)=>`<tr class="${i===nd.day?'is-today':''}"><td>${esc(D.days[i])}</td><td>${x?x.join(' – '):esc(D.closed)}</td></tr>`).join('');

  const sel = $('f-service'), cur = sel.value;
  sel.innerHTML = `<option value="">${esc(T('fServiceAny'))}</option>` + C.services.map((s,i)=>`<option value="${i}">${esc(L(s.title))}</option>`).join('');
  sel.value = cur;
  $('f-note').placeholder = T('fNotePh');
  const sub = $('f-submit'); sub.innerHTML = ico('wa') + esc(T('fSubmit'));
  if (C.whatsapp.guess){ sub.classList.add('guess'); sub.dataset.tag = T('guessTag'); sub.title = C.whatsapp.note||''; }

  $('foot').innerHTML = `${esc(`© ${new Date().getFullYear()} ${L(C.name)} · ${L(C.address)}`)}${C.photoCredit ? `<span class="credit">${esc(L(C.photoCredit))}</span>` : ''}`;
  $('footLinks').innerHTML = (C.instagram ? `<a class="btn btn-ghost btn-sm" href="${C.instagram}" target="_blank" rel="noopener">${ico('insta')}Instagram</a>` : '')
    + (C.facebook && C.facebook.url ? `<a class="btn btn-ghost btn-sm${G(C.facebook)}" href="${C.facebook.url}" target="_blank" rel="noopener">${ico('fb')}Facebook</a>` : '');

  $('bar').innerHTML = `<a class="btn btn-ghost" href="${telHref}">${ico('phone')}${esc(T('call'))}</a><a class="btn btn-wa" href="${waBase}?text=${encodeURIComponent(T('waHello'))}" target="_blank" rel="noopener">${ico('wa')}WhatsApp</a><a class="btn btn-primary" href="#book">${esc(T('book'))}</a>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-l]');
  if (b){ lang = b.dataset.l; try{localStorage.setItem('lang',lang)}catch(_){} render(); return; }
  if (e.target.closest('#notesBtn')){ notes = !notes; try{localStorage.setItem('notes',notes?'1':'0')}catch(_){} render(); return; }
  if (e.target.closest('#copyPhone')){
    const btn = $('copyPhone');
    const done = () => { btn.textContent = T('copied'); setTimeout(()=>btn.textContent=T('copy'),1500); };
    try { navigator.clipboard.writeText(C.phone).then(done, ()=>selectPhone()); } catch(_) { selectPhone(); }
  }
});
function selectPhone(){ const r=document.createRange(); r.selectNodeContents($('phoneText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
window.addEventListener('hashchange', () => { const x = location.hash.slice(1); if (LANGS.includes(x) && x!==lang){ lang = x; render(); } });

$('bookForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = id => $(id).value.trim();
  const err = !v('f-name') ? T('fNeedName') : !v('f-phone') ? T('fNeedPhone') : '';
  $('ferr').textContent = err;
  if (err) return;
  const s = $('f-service').value;
  const lines = [T('waHello'), '', `${T('fName')}: ${v('f-name')}`, `${T('fPhone')}: ${v('f-phone')}`,
    `${T('fService')}: ${s===''?T('fServiceAny'):L(C.services[+s].title)}`];
  if (v('f-date')) lines.push(`${T('fDate')}: ${v('f-date')}`);
  if (v('f-note')) lines.push(`${T('fNote')}: ${v('f-note')}`);
  const a = $('waOut'); a.href = waBase + '?text=' + encodeURIComponent(lines.join('\n')); a.click();
});

render();
setInterval(() => { const st = openState(); const el = document.querySelector('#nowCard .status'); if (el) el.querySelector('small').textContent = st.text; }, 60000);
})();
</script>
