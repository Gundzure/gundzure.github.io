let L="ka";try{L=localStorage.getItem("dt_lang")||"ka"}catch(e){}
function waLink(t){return "https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
function render(){const t=T[L];document.documentElement.lang=L;
document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
document.querySelectorAll("[data-wa]").forEach(a=>a.href=waLink(t.waHello+"."));
document.getElementById("h1").innerHTML=t.h1a+"<em>"+t.h1b+"</em>"+t.h1c;
document.getElementById("ogrid").innerHTML=OFFERS.map(o=>`<div class="ocard">${o[4]?`<span class="pct">${o[4]}</span>`:""}<h3>${t[o[0]]}</h3><div class="px"><div>${o[3]?`<span class="from">${t.fromW}</span>`:""}<span class="new">${o[1]}<small>₾</small></span></div><span class="old">${o[2]} ₾</span></div></div>`).join("");
document.getElementById("zlist").innerHTML=t.z.map((z,i)=>`<div>${ZI[i]}${z}</div>`).join("");
document.getElementById("rgrid").innerHTML=CASES.map(c=>`<article class="case"><div class="img"><img src="../img/${c[0]}.jpg" alt="${t[c[1]]}" loading="lazy">${c[0]==="ba-braces"?"":`<span class="lb b">${t.bf}</span><span class="lb a">${t.af}</span>`}</div><div class="txt"><h3>${t[c[1]]}</h3><p>${t[c[1]+"t"]}</p><span class="dr">${t[c[1]+"d"]}</span></div></article>`).join("");
const li=L==="ka"?1:L==="en"?2:3;
document.getElementById("tgrid").innerHTML=TEAM.map(d=>`<div class="doc"><div class="av">${L==="ka"?d[0]:d[2].split(" ").map(w=>w[0]).join("")}</div><div><b>${d[li]}</b><span>${t[d[4]]}</span></div></div>`).join("");
document.getElementById("cl").innerHTML=t.cl.map(x=>`<li>${x}</li>`).join("");
document.getElementById("revs").innerHTML=REV.map(r=>`<div class="rev"><span class="st">★★★★★</span><p>${r[1]}</p><footer><span>${r[0]}</span><span>Google</span></footer></div>`).join("");
document.getElementById("hours").innerHTML=t.days.map((d,i)=>`<span>${d}</span><span class="${i<6?"":"off"}">${i<6?"10:00–21:00":t.closed}</span>`).join("");
const s=document.getElementById("fSvc");s.innerHTML=`<option value="">${t.fSvcDef}</option>`+OFFERS.map(o=>`<option>${t[o[0]]}</option>`).join("");}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("dt_lang",L)}catch(e){}render()});
document.getElementById("bform").onsubmit=e=>{e.preventDefault();const t=T[L];const v=id=>document.getElementById(id).value.trim();
const msg=[t.waHello+(v("fSvc")?": "+v("fSvc"):"."),v("fName"),v("fPhone"),v("fMsg")].filter(Boolean).join("\n");window.open(waLink(msg),"_blank")};
render();
</script>
