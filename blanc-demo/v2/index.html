document.getElementById("svlist").innerHTML=t.svc.map((s,i)=>`<div class="sv"><span class="n">0${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p><span class="who">${s[2]}</span></div>`).join("");
document.getElementById("plist").innerHTML=t.pl.map(p=>`<div class="pc"><b>${p[0]}</b><span>${p[1]}</span><div class="px"><strong>${p[2]}</strong>${t.from}</div></div>`).join("");
document.getElementById("cgrid").innerHTML=t.cases.map((c,i)=>`<div class="case"><img src="../img/${CASES[i]}" alt="${c[0]}" loading="lazy"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");
document.getElementById("tgrid").innerHTML=t.team.map((d,i)=>`<div class="doc">${TEAMIMG[i]?`<div class="ph"><img src="../img/${TEAMIMG[i]}" alt="${d[0]}" loading="lazy"></div>`:`<div class="ph mono">DL</div>`}<b>${d[0]}</b><span>${d[1]}</span></div>`).join("");
document.getElementById("shl").innerHTML=t.shl.map(x=>`<li>${x}</li>`).join("");
document.getElementById("revs").innerHTML=REV.map(r=>`<div class="rev"><span class="st">★★★★★</span><p>${r[1]}</p><footer>${r[0]} · Google</footer></div>`).join("");
const s=document.getElementById("fSvc");s.innerHTML=`<option value="">${t.fSvcDef}</option>`+t.svc.map(o=>`<option>${o[0]}</option>`).join("");}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("bl_lang",L)}catch(e){}render()});
document.getElementById("bform").onsubmit=e=>{e.preventDefault();const t=T[L];const v=id=>document.getElementById(id).value.trim();
const msg=[t.waHello+(v("fSvc")?": "+v("fSvc"):"."),v("fName"),v("fPhone"),v("fMsg")].filter(Boolean).join("\n");window.open(waLink(msg),"_blank")};
render();
</script>
</body>
