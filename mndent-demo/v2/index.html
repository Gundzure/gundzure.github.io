<style>
:root{--red:#D3173D;--red2:#B0102F;--rose:#FDECEF;--ink:#1A1E29;--mute:#5E6472;--line:#E7E8EC;--mist:#F5F6F8;--night:#0C1424;--night2:#16223A;--neon:#FFE7C9;--wa:#1FA855;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Rubik,"Noto Sans Georgian",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
html[lang=ka] body{font-family:"Noto Sans Georgian",Rubik,system-ui,sans-serif}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:88px 0}
h1,h2,h3{line-height:1.18;letter-spacing:-.01em}
h2{font-size:clamp(28px,3.6vw,42px);font-weight:700}
h3{font-size:19px;font-weight:600}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
.kick:before{content:"";width:18px;height:2px;background:currentColor;border-radius:2px}
.lead{font-size:18px;color:var(--mute);max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px;border:0;cursor:pointer;font-family:inherit;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:18px;height:18px}
.btn-red{background:var(--red);color:#fff;box-shadow:0 8px 22px -8px rgba(211,23,61,.6)}
.btn-red:hover{background:var(--red2)}
.btn-wa{background:var(--wa);color:#fff}
.btn-ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:22px;height:72px}
.logo{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 50%;transform:scale(1.02)}
.logo b{font-family:Rubik,sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;display:block;line-height:1.05}
.logo small{display:block;font-size:12px;color:var(--mute);font-family:"Noto Sans Georgian",sans-serif}
.menu{display:flex;gap:24px;font-size:15px;font-weight:500}
.menu a:hover{color:var(--red)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:600 12px Rubik,"Noto Sans Georgian",sans-serif;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:#fff}
.top .btn{padding:11px 20px}
/* hero */
.hero{background:radial-gradient(1200px 600px at 75% 30%,#1d2c4b 0,var(--night) 60%);color:#fff;padding:72px 0 96px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-50% 0 0 0;background-image:radial-gradient(1.6px 1.6px at 20px 30px,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1.2px 1.2px at 80px 120px,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(2px 2px at 150px 60px,rgba(255,255,255,.35) 50%,transparent 51%),radial-gradient(1.3px 1.3px at 200px 170px,rgba(255,255,255,.45) 50%,transparent 51%);background-size:230px 210px;animation:snow 18s linear infinite;pointer-events:none;opacity:.7}
@keyframes snow{to{transform:translateY(50%)}}
@media (prefers-reduced-motion:reduce){.hero:before{animation:none}}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;position:relative}
.hero .kick{color:#FF8FA5}
.hero h1{font-size:clamp(36px,5vw,62px);font-weight:700;margin-bottom:20px}
.hero h1 em{font-style:normal;color:var(--neon);text-shadow:0 0 18px rgba(255,180,120,.55),0 0 2px #fff}
.hero p.lead{color:#C5CDDC;margin-bottom:30px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:999px;font-size:14px;color:#E4E9F2}
.chip b{color:#FFD36B}
.chip svg{width:16px;height:16px;color:#FF8FA5}
.sign{position:relative}
.sign img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:24px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 80px -20px rgba(255,170,110,.35),0 20px 50px rgba(0,0,0,.5)}
.sign .tag{position:absolute;left:-18px;bottom:-22px;background:#fff;color:var(--ink);border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:290px}
.sign .tag img{width:42px;height:42px;border-radius:50%;aspect-ratio:1;box-shadow:none}
.sign .tag b{display:block;font-size:15px}
.sign .tag span{font-size:13px;color:var(--mute);line-height:1.35;display:block}
/* facts */
.facts{padding:0;margin-top:-40px;position:relative;z-index:3}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:var(--r);box-shadow:0 20px 50px -18px rgba(12,20,36,.25);border:1px solid var(--line)}
.fact{padding:24px 26px;border-right:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.fact:last-child{border-right:0}
.fact .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--rose);color:var(--red);display:grid;place-items:center}
.fact .ic svg{width:22px;height:22px}
.fact b{display:block;font-size:16px;line-height:1.3}
.fact span{font-size:14px;color:var(--mute);line-height:1.4;display:block;margin-top:3px}
/* surgery */
.surg .wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.sl{list-style:none;margin:28px 0 30px;display:grid;gap:14px}
.sl li{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:14px}
.sl li svg{flex:none;width:22px;height:22px;color:var(--red);margin-top:2px}
.sl li b{display:block;font-size:16px}
.sl li span{font-size:14.5px;color:var(--mute)}
.qcard{background:var(--red);color:#fff;border-radius:24px;padding:44px 40px;position:relative;overflow:hidden}
.qcard:after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(255,255,255,.09)}
.qcard .mk{font-size:90px;line-height:.6;font-family:Georgia,serif;opacity:.5}
.qcard blockquote{font-size:clamp(21px,2.3vw,27px);font-weight:600;line-height:1.38;margin:14px 0 24px;position:relative;z-index:1}
.qcard .who{font-size:14px;opacity:.85;position:relative;z-index:1}
.qcard .dr{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.25);position:relative;z-index:1}
.qcard .dr i{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-style:normal;font-weight:700}
.qcard .dr b{display:block}
.qcard .dr span{font-size:14px;opacity:.85}
/* services */
.svc{background:var(--mist)}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:40px;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.sv{background:#fff;border-radius:var(--r);padding:26px 24px;border:1px solid var(--line);transition:border-color .2s,transform .2s}
.sv:hover{border-color:var(--red);transform:translateY(-2px)}
.sv .ic{width:46px;height:46px;border-radius:50%;background:var(--rose);color:var(--red);display:grid;place-items:center;margin-bottom:18px}
.sv .ic svg{width:24px;height:24px}
.sv h3{margin-bottom:8px}
.sv p{font-size:14.5px;color:var(--mute)}
.sv .dr{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:var(--red)}
/* tour */
.tgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:260px 260px;gap:16px;margin-top:40px}
.ph{position:relative;border-radius:var(--r);overflow:hidden;background:var(--mist)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph:hover img{transform:scale(1.04)}
.ph figcaption{position:absolute;left:12px;bottom:12px;right:12px;background:rgba(255,255,255,.94);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.35}
.ph figcaption b{display:block;font-size:15px}
.ph figcaption span{color:var(--mute);font-size:13px}
.ph.p1{grid-row:span 2}
.ph.p4{grid-column:span 1}
/* visit */
.visit{background:var(--night);color:#fff}
.visit .lead{color:#AEB8CB}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:44px}
.vs{background:var(--night2);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:26px 24px}
.vs b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--red);font-size:15px;margin-bottom:18px}
.vs h3{font-size:18px;margin-bottom:8px}
.vs p{font-size:14.5px;color:#AEB8CB}
.xr{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;margin-top:30px;background:var(--night2);border-radius:var(--r);padding:18px;border:1px solid rgba(255,255,255,.08)}
.xr img{width:150px;height:150px;object-fit:cover;border-radius:12px;object-position:50% 40%}
.xr p{color:#C5CDDC;font-size:15.5px;max-width:720px}
.xr p b{color:#fff}
/* team */
.tmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.doc{border:1px solid var(--line);border-radius:var(--r);padding:28px 26px;display:flex;flex-direction:column}
.doc .av{width:62px;height:62px;border-radius:50%;background:var(--rose);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:16px}
.doc.f .av{background:var(--red);color:#fff}
.doc h3{margin-bottom:2px}
.doc .role{font-size:14px;color:var(--red);font-weight:600}
.doc ul{list-style:none;margin:14px 0 18px;display:flex;flex-wrap:wrap;gap:6px}
.doc ul li{font-size:12.5px;background:var(--mist);padding:4px 10px;border-radius:999px;color:var(--mute)}
.doc q{display:block;font-size:15px;color:var(--ink);border-left:3px solid var(--red);padding-left:14px;margin-top:auto;quotes:"„" "“"}
.doc q+small{display:block;font-size:13px;color:var(--mute);margin-top:8px;padding-left:17px}
/* access */
.acc{padding:0}
.accb{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;background:var(--rose);border-radius:24px;padding:30px 36px}
.accb .ic{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.accb .ic svg{width:32px;height:32px}
.accb h3{font-size:21px;margin-bottom:4px}
.accb p{color:var(--mute);font-size:15px}
/* reviews */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.score{display:flex;align-items:center;gap:14px}
.score b{font-size:48px;font-weight:700;line-height:1}
.score i{font-style:normal;color:#F5A623;letter-spacing:2px}
.score span{font-size:14px;color:var(--mute)}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rev{border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px}
.rev .st{color:#F5A623;letter-spacing:2px}
.rev p{font-size:15px;flex:1}
.rev footer{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mute)}
.rev footer span:first-child{font-weight:600;color:var(--ink)}
/* contact */
.contact{background:var(--mist)}
.ct{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-top:40px}
.cinfo{background:#fff;border-radius:var(--r);padding:28px;border:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.ci{display:flex;gap:14px}
.ci>svg{flex:none;width:22px;height:22px;color:var(--red);margin-top:3px}
.ci b{display:block;font-size:16px}
.ci span{font-size:14px;color:var(--mute)}
.hours{display:grid;grid-template-columns:auto 1fr;gap:3px 18px;font-size:14px;margin-top:6px;color:var(--mute)}
.hours .off{color:var(--red)}
.map{border-radius:14px;overflow:hidden;height:230px;border:1px solid var(--line)}
.map iframe{width:100%;height:100%;border:0}
.bk{background:#fff;border-radius:var(--r);padding:30px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.bk h3{font-size:22px;margin-bottom:6px}
.bk input,.bk select,.bk textarea{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:var(--mist);color:var(--ink)}
.bk textarea{min-height:96px;resize:vertical}
.bk input:focus,.bk select:focus,.bk textarea:focus{outline:2px solid var(--red);outline-offset:1px}
.bk small{color:var(--mute);font-size:13px}
.bk .note{background:var(--rose);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--red2)}
footer.site{background:var(--night);color:#8C97AD;font-size:14px;padding:26px 0}
footer.site .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mbar{display:none}
@media (max-width:1020px){
.menu{display:none}
.hero .wrap,.surg .wrap,.ct{grid-template-columns:1fr}
.hero .wrap{gap:50px}
.fgrid{grid-template-columns:1fr 1fr}
.fact:nth-child(2){border-right:0}
.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}
.sgrid,.vgrid{grid-template-columns:1fr 1fr}
.tgrid{grid-template-columns:1fr 1fr;grid-template-rows:auto}
.ph{height:240px}
.ph.p1{grid-row:auto;grid-column:span 2;height:320px}
.tmgrid,.revs{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
section{padding:64px 0}
.wrap{padding:0 16px}
.top .wrap{height:64px;gap:10px}
.top .btn{display:none}
.logo small{display:none}
.hero{padding:44px 0 80px}
.sign .tag{left:10px;right:10px;bottom:-26px;max-width:none}
.fgrid,.sgrid,.vgrid,.tmgrid,.revs{grid-template-columns:1fr}
.fact{border-right:0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.tgrid{grid-template-columns:1fr}
.ph.p1{grid-column:auto}
.qcard{padding:34px 26px}
.accb{grid-template-columns:1fr;text-align:left;padding:26px}
.xr{grid-template-columns:1fr}
.xr img{width:100%;height:200px}
.mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:60}
.mbar .btn{padding:13px 10px}
.mbar .btn-ghost{color:var(--ink)}
footer.site{padding-bottom:90px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <a class="logo" href="#"><img src="../img/logo.jpg" alt="MN DENT"><span><b>MN DENT</b><small>ემენ დენტი · ვარკეთილი</small></span></a>
 <nav class="menu"><a href="#surgery" data-t="nSurg"></a><a href="#services" data-t="nSvc"></a><a href="#tour" data-t="nTour"></a><a href="#team" data-t="nTeam"></a><a href="#contact" data-t="nContact"></a></nav>
 <div class="lang"><button data-l="ka">ქარ</button><button data-l="en">EN</button><button data-l="ru">RU</button></div>
 <a class="btn btn-red" href="#contact" data-t="book"></a>
</div></header>

<section class="hero"><div class="wrap">
 <div>
  <span class="kick" data-t="hK"></span>
  <h1 id="h1"></h1>
  <p class="lead" data-t="hLead"></p>
  <div class="cta"><a class="btn btn-wa" data-wa href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span data-t="hWa"></span></a><a class="btn btn-ghost" href="tel:+995558925591">558 92 55 91</a></div>
  <div class="chips" id="chips"></div>
 </div>
 <div class="sign">
  <img src="../img/neon.jpg" alt="ემენ დენტი" id="neonImg">
  <div class="tag"><img src="../img/logo.jpg" alt=""><div><b data-t="tagT"></b><span data-t="tagS"></span></div></div>
 </div>
</div></section>

<section class="facts"><div class="wrap"><div class="fgrid" id="facts"></div></div></section>

<section class="surg" id="surgery"><div class="wrap">
 <div>
  <span class="kick" data-t="sK"></span>
  <h2 data-t="sTitle"></h2>
  <p class="lead" data-t="sLead" style="margin-top:14px"></p>
  <ul class="sl" id="sl"></ul>
  <a class="btn btn-red" data-wa href="#" data-t="sCta"></a>
 </div>
 <div class="qcard">
  <div class="mk">“</div>
  <blockquote data-t="sQ"></blockquote>
  <div class="who" data-t="sQwho"></div>

 <div class="sgrid" id="sgrid"></div>
</div></section>

<section id="tour"><div class="wrap">
 <span class="kick" data-t="tK"></span><h2 data-t="tTitle"></h2><p class="lead" data-t="tLead" style="margin-top:14px"></p>
 <div class="tgrid" id="tgrid"></div>
</div></section>

<section class="visit"><div class="wrap">
 <span class="kick" style="color:#FF8FA5" data-t="vK"></span><h2 data-t="vTitle"></h2><p class="lead" data-t="vLead" style="margin-top:14px"></p>
 <div class="vgrid" id="vgrid"></div>
 <div class="xr"><img src="../img/xray.jpg" alt="X-ray" loading="lazy"><p id="xrT"></p></div>
</div></section>

<section id="team"><div class="wrap">
 <span class="kick" data-t="tmK"></span><h2 data-t="tmTitle"></h2><p class="lead" data-t="tmLead" style="margin-top:14px"></p>

let L="ka";try{L=localStorage.getItem("mn_lang")||"ka"}catch(e){}

document.getElementById("sgrid").innerHTML=SVC.map(s=>`<article class="sv"><div class="ic">${svg(s[0])}</div><h3>${t[s[1]]}</h3><p>${t[s[1]+"p"]}</p>${t[s[1]+"d"]?`<span class="dr">${t[s[1]+"d"]}</span>`:""}</article>`).join("");
document.getElementById("tgrid").innerHTML=TOUR.map((n,i)=>`<figure class="ph p${i+1}"><img src="../img/${n}.jpg" alt="${t.tour[i][0]}" loading="lazy"><figcaption><b>${t.tour[i][0]}</b><span>${t.tour[i][1]}</span></figcaption></figure>`).join("");
document.getElementById("vgrid").innerHTML=t.steps.map((s,i)=>`<div class="vs"><b>${i+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
document.getElementById("xrT").innerHTML=t.xr;
document.getElementById("tmgrid").innerHTML=t.team.map(d=>`<div class="doc${d[6]?" f":""}"><div class="av">${d[0]}</div><h3>${d[1]}</h3><span class="role">${d[2]}</span><ul>${d[3].map(x=>`<li>${x}</li>`).join("")}</ul><q>${d[4]}</q><small>${d[5]}, Google</small></div>`).join("");

document.getElementById("hours").innerHTML=t.days.map((d,i)=>`<span>${d}</span><span${HRS[i]?"":" class=off"}>${HRS[i]?HRS[i][0]+"–"+HRS[i][1]:t.closed}</span>`).join("");
const s=document.getElementById("fSvc");s.innerHTML=`<option value="">${t.fSvcDef}</option>`+SVC.map(o=>`<option>${t[o[1]]}</option>`).join("");}
