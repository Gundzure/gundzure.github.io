let L="ka";try{L=localStorage.getItem("nd_lang")||"ka"}catch(e){}
function waLink(t){return "https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
function render(){const t=T[L];document.documentElement.lang=L;
document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});
document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
document.querySelectorAll("[data-wa]").forEach(a=>a.href=waLink(t.waHello+"."));
document.getElementById("h1").innerHTML=t.h1a+"<em>"+t.h1b+"</em>"+t.h1c;
document.getElementById("plist").innerHTML=t.pl.map((p,i)=>`<div><span>0${i+1}</span><p>${p}</p></div>`).join("");
document.getElementById("sgrid").innerHTML=SVC.map(s=>`<article class="svc">${svg(s[0])}<h3>${t[s[1]]}</h3><p>${t[s[1]+"p"]}</p><ul>${t[s[1]+"l"].map(x=>`<li>${x}</li>`).join("")}</ul></article>`).join("");
document.getElementById("achips").innerHTML=t.al.map(x=>`<span>${x}</span>`).join("");
document.getElementById("gets").innerHTML=t.go.map(x=>`<div>${svg("check")}${x}</div>`).join("");
document.getElementById("ochips").innerHTML=t.oc.map(x=>`<span>${x}</span>`).join("");
document.getElementById("ilist").innerHTML=(L==="ka"?INSKA:INS).map(x=>`<span>${x}</span>`).join("");
document.getElementById("ogrid").innerHTML=t.of.map(o=>`<div class="oc${o[5]?" hl":""}"><span class="who">${o[0]}</span><h3>${o[1]}</h3><p>${o[2]}</p>${o[3]?`<div class="px"><b>${o[3]}</b><s>${o[4]}</s></div>`:""}</div>`).join("");
document.getElementById("tgrid").innerHTML=t.team.map(d=>`<div class="doc"><b>${d[0]}</b><span>${d[1]}</span></div>`).join("");
document.getElementById("nlist").innerHTML=t.nl.map(x=>`<li>${x}</li>`).join("");
document.getElementById("revs").innerHTML=REV.map(r=>`<div class="rev"><span class="st">★★★★★</span><p>${r[1]}</p><footer><span>${r[0]}</span><span>Google</span></footer></div>`).join("");
document.getElementById("hours").innerHTML=t.days.map(d=>`<span>${d}</span><span>09:00–21:00</span>`).join("");
const s=document.getElementById("fSvc");s.innerHTML=`<option value="">${t.fSvcDef}</option>`+SVC.map(o=>`<option>${t[o[1]]}</option>`).join("");}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("nd_lang",L)}catch(e){}render()});
document.getElementById("bform").onsubmit=e=>{e.preventDefault();const t=T[L];const v=id=>document.getElementById(id).value.trim();
const msg=[t.waHello+(v("fSvc")?": "+v("fSvc"):"."),v("fName"),v("fPhone"),v("fMsg")].filter(Boolean).join("\n");window.open(waLink(msg),"_blank")};
render();
</script>
