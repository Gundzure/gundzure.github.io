document.querySelectorAll("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});

document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
document.querySelectorAll("[data-wa]").forEach(a=>a.href=waLink(t.waHello+"."));
document.getElementById("h1").innerHTML=t.h1a+"<em>"+t.h1b+"</em>";
document.getElementById("odT").innerHTML=t.odA+"<em>"+t.odB+"</em>";

document.getElementById("odl").innerHTML=t.odl.map(x=>`<li>${x}</li>`).join("");
document.getElementById("cgrid").innerHTML=CASES.map(c=>`<article class="case"><div class="im"><img src="../img/${c[0]}.jpg" alt="${t[c[1]]}" loading="lazy"></div><div class="t"><span class="tag">${t[c[1]+"t"]}</span><h3>${t[c[1]]}</h3><p>${t[c[1]+"p"]}</p><div class="dr">${t[c[1]+"d"]}</div></div></article>`).join("");
const li=L==="ka"?1:L==="en"?2:3;
document.getElementById("tgrid").innerHTML=TEAM.map(d=>`<div class="doc"><div class="av">${L==="ka"?d[0]:d[2].split(" ").map(w=>w[0]).join("")}</div><div><b>${d[li]}</b><span>${t[d[4]]}</span>${d[5]?`<em>${d[5]}${t.yrs}</em>`:""}</div></div>`).join("");
document.getElementById("tpgrid").innerHTML=t.tp.map(x=>`<div class="tp"><span class="q">“</span><b>${x[0]}</b><p>${x[1]}</p></div>`).join("");
document.getElementById("revs").innerHTML=REV.map(r=>`<div class="rev"><span class="st">★★★★★</span><p>${r[1]}</p><footer><span>${r[0]}</span><span>Google</span></footer></div>`).join("");

const s=document.getElementById("fSvc");s.innerHTML=`<option value="">${t.fSvcDef}</option>`+SV.map(k=>`<option>${t[k]}</option>`).join("");}

document.getElementById("bform").onsubmit=e=>{e.preventDefault();const t=T[L];const v=id=>document.getElementById(id).value.trim();
